# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - passwordmanagerespi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies and build Next.js
        run: |
          npm install --legacy-peer-deps
          npm run build
          # Supprimer les caches volumineux et dépendances de développement pour alléger le déploiement
          rm -rf .next/cache
          npm prune --omit=dev --legacy-peer-deps

      - name: Create optimized deployment zip
        run: |
          mkdir -p deploy-pkg
          cp -r .next deploy-pkg/
          cp -r node_modules deploy-pkg/
          cp -r public deploy-pkg/ 2>/dev/null || true
          cp server.js package.json startup.txt action_logs.json deploy-pkg/ 2>/dev/null || true
          cd deploy-pkg
          zip -q -r ../release.zip .
          cd ..
          ls -lh release.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_14FEE54EC8C0429992ECE64DEEA9BE84 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_17F70EA813204B5DAFE31432C501BD21 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0AD806A1CF59441489B7BBC3A1838A1A }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'passwordmanagerespi'
          slot-name: 'Production'
          package: release.zip
